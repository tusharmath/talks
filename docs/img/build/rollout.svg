<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Space Mono, ui-monospace, Menlo, monospace">
  <!-- Rollout: roles are handed to the factory one at a time. Each bar fills to the share the factory takes on (QA 100%, Frontend 100%, Backend 80%, Platform 40%) and its percentage appears when it lands. SMIL only, 10s loop -->
  <text x="220" y="72.0" text-anchor="end" font-size="20" font-weight="700" letter-spacing="1" fill="#f2f2f2">QA</text>
  <rect x="250" y="50" width="560" height="30" fill="rgba(255,255,255,0.08)"/>
  <rect x="250" y="50" width="0" height="30" fill="#f97316"><animate attributeName="width" values="0;0;560.0;560.0;0" keyTimes="0;0.0400;0.1500;0.94;1" dur="10.0s" repeatCount="indefinite"/></rect>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1500;0.1800;0.94;1" dur="10.0s" repeatCount="indefinite"/><g transform="translate(778.0 55.0) scale(0.833)" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="834" y="72.0" text-anchor="start" font-size="20" font-weight="700" letter-spacing="1" fill="#f97316">100%</text></g>
  <text x="220" y="152.0" text-anchor="end" font-size="20" font-weight="700" letter-spacing="1" fill="#f2f2f2">Frontend</text>
  <rect x="250" y="130" width="560" height="30" fill="rgba(255,255,255,0.08)"/>
  <rect x="250" y="130" width="0" height="30" fill="#f97316"><animate attributeName="width" values="0;0;560.0;560.0;0" keyTimes="0;0.1700;0.2800;0.94;1" dur="10.0s" repeatCount="indefinite"/></rect>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2800;0.3100;0.94;1" dur="10.0s" repeatCount="indefinite"/><g transform="translate(778.0 135.0) scale(0.833)" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="834" y="152.0" text-anchor="start" font-size="20" font-weight="700" letter-spacing="1" fill="#f97316">100%</text></g>
  <text x="220" y="232.0" text-anchor="end" font-size="20" font-weight="700" letter-spacing="1" fill="#f2f2f2">Backend</text>
  <rect x="250" y="210" width="560" height="30" fill="rgba(255,255,255,0.08)"/>
  <rect x="250" y="210" width="0" height="30" fill="#f97316"><animate attributeName="width" values="0;0;448.0;448.0;0" keyTimes="0;0.3000;0.3880;0.94;1" dur="10.0s" repeatCount="indefinite"/></rect>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3880;0.4180;0.94;1" dur="10.0s" repeatCount="indefinite"/><g transform="translate(666.0 215.0) scale(0.833)" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="834" y="232.0" text-anchor="start" font-size="20" font-weight="700" letter-spacing="1" fill="#f97316">80%</text></g>
  <text x="220" y="312.0" text-anchor="end" font-size="20" font-weight="700" letter-spacing="1" fill="#f2f2f2">Platform</text>
  <rect x="250" y="290" width="560" height="30" fill="rgba(255,255,255,0.08)"/>
  <rect x="250" y="290" width="0" height="30" fill="#f97316"><animate attributeName="width" values="0;0;224.0;224.0;0" keyTimes="0;0.4300;0.4740;0.94;1" dur="10.0s" repeatCount="indefinite"/></rect>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4740;0.5040;0.94;1" dur="10.0s" repeatCount="indefinite"/><g transform="translate(442.0 295.0) scale(0.833)" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="834" y="312.0" text-anchor="start" font-size="20" font-weight="700" letter-spacing="1" fill="#f97316">40%</text></g>
</svg>
