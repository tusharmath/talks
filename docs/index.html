<!DOCTYPE html>
<html>
  <head>
    <title>Scaling GraphQL for the Millions | Tailcall</title>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="./app.css" />
    <script>
      // Theme: "dark" (default) or "light". ?theme=light|dark in the URL wins and
      // is remembered; otherwise the last choice from localStorage. Set on <html>
      // here, before the body renders, so the page never flashes the other theme.
      var THEMES = ["dark", "light"];
      var THEME_KEY = "slides-theme";
      function storedTheme() {
        try {
          return localStorage.getItem(THEME_KEY);
        } catch (e) {
          return null;
        }
      }
      function saveTheme(theme) {
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (e) {}
      }
      (function () {
        var param = new URLSearchParams(location.search).get("theme");
        if (THEMES.indexOf(param) >= 0) saveTheme(param);
        var theme = THEMES.indexOf(param) >= 0 ? param : storedTheme();
        document.documentElement.dataset.theme = THEMES.indexOf(theme) >= 0 ? theme : "dark";
      })();
    </script>
    <script>
      // Google Analytics script
      (function (i, s, o, g, r, a, m) {
        i["GoogleAnalyticsObject"] = r;
        (i[r] =
          i[r] ||
          function () {
            (i[r].q = i[r].q || []).push(arguments);
          }),
          (i[r].l = 1 * new Date());
        (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m);
      })(
        window,
        document,
        "script",
        "https://www.google-analytics.com/analytics.js",
        "ga"
      );

      // Initialize GA with your tracking ID
      ga("create", "G-JEP3QDWT0G", "auto");
      ga("send", "pageview");
    </script>
  </head>
  <body>
    <textarea id="source"> </textarea>

    <script src="https://remarkjs.com/downloads/remark-latest.min.js"></script>
    <script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
    <script>
      // ---------------------------------------------------------------------------
      // Configuration
      // ---------------------------------------------------------------------------
      var CONFIG = {
        // Bottom-right corner of every slide:
        //   "none"    nothing
        //   "number"  slide number (e.g. 12 / 29)
        //   "preview" tiny preview of the next slide
        // Override per visit with ?footer=none|number|preview in the URL.
        footer: "number",
        // Size of the next-slide preview, as a fraction of the slide.
        previewScale: 0.08,
        // Colour theme when nothing is chosen yet: "dark" or "light". Switch
        // with the `d` key or the corner button; ?theme=light|dark in the URL
        // overrides it. The choice is remembered in localStorage.
        theme: "dark",
        // Animation when moving to another slide:
        //   "fade"   quick fade in with a slight upward drift (default)
        //   "slide"  quick fade in from the side, in the direction of travel
        //   "none"   instant cut
        // `--` build steps never re-animate the slide; only the newly revealed
        // part fades in. Off for prefers-reduced-motion and in print.
        // Override per visit with ?transition=fade|slide|none in the URL.
        transition: "fade",
      };
      var THEME_KEY_BINDING = "d"; // remark already uses b c f h j k m p t ?
      if (!storedTheme() && !new URLSearchParams(location.search).get("theme")) {
        document.documentElement.dataset.theme = CONFIG.theme;
      }
      var FOOTERS = ["none", "number", "preview"];
      var footerParam = new URLSearchParams(location.search).get("footer");
      var footer = FOOTERS.indexOf(footerParam) >= 0 ? footerParam : CONFIG.footer;
      document.body.dataset.footer = footer;
      var TRANSITIONS = ["none", "fade", "slide"];
      var transitionParam = new URLSearchParams(location.search).get("transition");
      var transition = TRANSITIONS.indexOf(transitionParam) >= 0 ? transitionParam : CONFIG.transition;
      document.body.dataset.transition = transition;

      // Theme toggle: the key above, or a faint sun/moon button in the bottom-right
      // corner of the window that only shows up fully on hover.
      function currentTheme() {
        return document.documentElement.dataset.theme === "light" ? "light" : "dark";
      }
      // Code blocks use the matching highlight.js palette for the theme.
      function syncCodeTheme() {
        var light = currentTheme() === "light";
        document.querySelectorAll(".hljs-tomorrow-night, .hljs-tomorrow").forEach(function (el) {
          el.classList.toggle("hljs-tomorrow-night", !light);
          el.classList.toggle("hljs-tomorrow", light);
        });
      }
      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        saveTheme(theme);
        syncCodeTheme();
      }
      function toggleTheme() {
        setTheme(currentTheme() === "light" ? "dark" : "light");
      }
      var themeButton = document.createElement("button");
      themeButton.className = "theme-toggle";
      themeButton.type = "button";
      themeButton.title = "Toggle light/dark theme (" + THEME_KEY_BINDING + ")";
      themeButton.setAttribute("aria-label", "Toggle light/dark theme");
      themeButton.innerHTML =
        '<i data-lucide="sun" class="theme-icon-sun"></i><i data-lucide="moon" class="theme-icon-moon"></i>';
      document.body.appendChild(themeButton);
      // Delegated: remark re-creates the body's content inside .remark-container,
      // so a listener on the button itself would be lost.
      document.addEventListener("click", function (e) {
        var button = e.target.closest && e.target.closest(".theme-toggle");
        if (!button) return;
        toggleTheme();
        button.blur();
      });
      lucide.createIcons();
      document.addEventListener("keydown", function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        if (e.key === THEME_KEY_BINDING) toggleTheme();
      });
      // Keep cloned windows (remark's `c`) on the same theme.
      window.addEventListener("storage", function (e) {
        if (e.key === THEME_KEY && THEMES.indexOf(e.newValue) >= 0 && e.newValue !== currentTheme()) {
          document.documentElement.dataset.theme = e.newValue;
          syncCodeTheme();
        }
      });

      // Pick the deck from ?deck=<name> → ./<name>.md (defaults to index.md, the deck list).
      var deck = new URLSearchParams(location.search).get("deck") || "index";
      if (!/^[\w-]+$/.test(deck)) deck = "index";
      // Lets app.css style one deck without touching the others.
      document.body.dataset.deck = deck;
      // `.icon[sparkles]` → Lucide "sparkles" icon (names: https://lucide.dev/icons).
      // Remark renders it as <span class="icon">sparkles</span>; swap the text for the SVG.
      function renderIcons() {
        document.querySelectorAll(".icon").forEach(function (el) {
          var name = el.textContent.trim();
          if (el.children.length || !/^[a-z0-9-]+$/.test(name)) return;
          el.innerHTML = '<i data-lucide="' + name + '"></i>';
        });
        lucide.createIcons();
      }

      // The deck markdown loads asynchronously; the callback fires once slides are in the DOM.
      var slideshow = remark.create(
        {
          sourceUrl: "./" + deck + ".md",
          highlightStyle: "tomorrow-night",
          ratio: "16:9",
          navigation: {
            scroll: false,
            click: false,
          },
          countIncrementalSlides: false,
        },
        function () {
          renderIcons();
          syncCodeTheme();
          reserveIncrementalSpace();
          prefetchImages();
          setPageTitle();
        }
      );

      // The tab title comes from the deck itself: the first slide's `#` heading, or
      // failing that its first block of text (e.g. a `.font-size-4[...]` title).
      function setPageTitle() {
        var first = slideContents()[0];
        if (!first) return;
        var pick = first.querySelector("h1");
        if (!pick) {
          pick = Array.prototype.find.call(first.children, function (c) {
            return (
              !c.classList.contains("remark-slide-number") &&
              !c.classList.contains("incremental-pending") &&
              c.textContent.trim()
            );
          });
        }
        var title = pick && pick.textContent.replace(/\s+/g, " ").trim();
        if (title) document.title = title;
      }

      // Every SVG in the deck (plus the confetti) is downloaded once at load and kept
      // in memory. Restarting an animation needs a new URL per show; a fresh blob: URL
      // of the cached file gives that without going back to the network.
      var imageCache = {};
      function originalSrc(img) {
        return img.dataset.src || img.getAttribute("src").split("?")[0];
      }
      function prefetchImages() {
        var srcs = { "./img/confetti.svg": true };
        document.querySelectorAll('.remark-slide-content img[src*=".svg"]').forEach(function (img) {
          srcs[originalSrc(img)] = true;
        });
        Object.keys(srcs).forEach(loadImage);
      }
      // Promise of the image's data (one download per file, shared by every caller).
      function loadImage(src) {
        if (!imageCache[src]) {
          imageCache[src] = fetch(src)
            .then(function (r) {
              return r.ok ? r.blob() : null;
            })
            .catch(function () {
              return null;
            });
        }
        return imageCache[src];
      }
      // Calls back with a URL for `src` that the browser treats as new (so animations
      // restart) but that is served from memory, never the network.
      function withFreshUrl(src, done) {
        loadImage(src).then(function (blob) {
          done(blob ? URL.createObjectURL(blob) : src + "?t=" + Date.now());
        });
      }

      // `--` builds: remark renders each step as its own slide holding only the
      // content revealed so far, so centred layouts re-centre on every step.
      // Give each step the not-yet-revealed content from the final step, hidden,
      // so every step lays out exactly like the finished slide and nothing moves.
      function reserveIncrementalSpace() {
        var slides = slideshow.getSlides();
        var contents = document.querySelectorAll(".remark-slide-content");
        var blocks = function (el) {
          return Array.prototype.filter.call(el.children, function (c) {
            return !c.classList.contains("remark-slide-number");
          });
        };
        for (var i = 0; i < slides.length; i++) {
          // Find the last step of the group that starts here.
          var last = i;
          while (last + 1 < slides.length && slides[last + 1].properties.continued === "true") last++;
          var full = blocks(contents[last]);
          for (var j = i; j < last; j++) {
            var shown = blocks(contents[j]).length;
            var number = contents[j].querySelector(".remark-slide-number");
            full.slice(shown).forEach(function (b) {
              var ghost = b.cloneNode(true);
              ghost.classList.add("incremental-pending");
              ghost.setAttribute("aria-hidden", "true");
              contents[j].insertBefore(ghost, number);
            });
          }
          i = last;
        }
      }

      // Remark builds every slide at load, so SVG animations would start (and one-shot
      // ones finish) before their slide is shown. Reload the slide's SVG images on show
      // so each animation starts from the beginning when the slide appears.
      // `--` steps of one slide share a build group; moving between them keeps the
      // running animations instead of restarting them.
      function groupOf(index) {
        var slides = slideshow.getSlides();
        while (index > 0 && slides[index].properties.continued === "true") index--;
        return index;
      }
      function svgImages(container) {
        return Array.prototype.filter.call(
          // data-src: images already swapped to an in-memory blob: URL.
          container.querySelectorAll('img[src*=".svg"]:not(.celebrate-overlay), img[data-src]:not(.celebrate-overlay)'),
          function (img) {
            return !img.closest(".incremental-pending") && !img.closest(".slide-preview");
          }
        );
      }
      // The real slides only (not the copies inside the next-slide preview).
      function slideContents() {
        return Array.prototype.filter.call(
          document.querySelectorAll(".remark-slide-content"),
          function (el) {
            return !el.closest(".slide-preview");
          }
        );
      }

      // Bottom right: a tiny live preview of the next slide (instead of the slide
      // number). `--` steps of the current slide are skipped, so it always shows the
      // next real slide; the last slide shows nothing.
      var PREVIEW_SCALE = CONFIG.previewScale;
      function showNextPreview(index) {
        document.querySelectorAll(".slide-preview").forEach(function (el) {
          el.remove();
        });
        if (footer !== "preview") return;
        var slides = slideshow.getSlides();
        var contents = slideContents();
        var next = index + 1;
        while (next < slides.length && slides[next].properties.continued === "true") next++;
        if (next >= slides.length) return;
        var host = contents[index];
        var w = host.offsetWidth;
        var h = host.offsetHeight;
        var box = document.createElement("div");
        box.className = "slide-preview";
        box.setAttribute("aria-hidden", "true");
        box.style.width = w * PREVIEW_SCALE + "px";
        box.style.height = h * PREVIEW_SCALE + "px";
        var inner = document.createElement("div");
        inner.className = "slide-preview-inner";
        inner.style.width = w + "px";
        inner.style.height = h + "px";
        inner.style.transform = "scale(" + PREVIEW_SCALE + ")";
        var copy = contents[next].cloneNode(true);
        copy.querySelectorAll(".remark-slide-number, .celebrate-overlay").forEach(function (el) {
          el.remove();
        });
        inner.appendChild(copy);
        box.appendChild(inner);
        host.appendChild(box);
      }
      // `class: shatter` slides: on the last `--` step, the `#` heading cracks and
      // its letters fall off the slide. Replays every time that step is shown.
      function shatterHeading(index) {
        var slides = slideshow.getSlides();
        var slide = slideContents()[index];
        if (!slide || !slide.classList.contains("shatter")) return;
        var isLastStep = index + 1 >= slides.length || slides[index + 1].properties.continued !== "true";
        if (!isLastStep) return;
        var h1 = Array.prototype.find.call(slide.querySelectorAll("h1"), function (h) {
          return !h.closest(".incremental-pending");
        });
        if (!h1) return;
        var text = h1.dataset.text || h1.textContent;
        h1.dataset.text = text;
        h1.classList.remove("shattering");
        h1.innerHTML = "";
        Array.from(text).forEach(function (ch, i) {
          var s = document.createElement("span");
          s.className = "shard";
          s.textContent = ch;
          s.style.setProperty("--dx", Math.round((Math.random() - 0.5) * 240) + "px");
          s.style.setProperty("--lift", Math.round(-10 - Math.random() * 40) + "px");
          s.style.setProperty("--rot", Math.round((Math.random() - 0.5) * 220) + "deg");
          s.style.setProperty("--delay", Math.round(1200 + Math.random() * 1400) + "ms");
          h1.appendChild(s);
        });
        void h1.offsetWidth; // restart the animation
        h1.classList.add("shattering");
      }

      // Slide transitions: a CSS animation (app.css) started by a class on the
      // shown slide's container. Only one slide ever carries it, so jumping several
      // slides at once never queues animations. Runs alongside, never before, the
      // image restarts below.
      var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      function clearTransition(el) {
        el.classList.remove("slide-enter", "slide-enter-back", "reveal-enter");
      }
      document.addEventListener("animationend", function (e) {
        if (/^(slide|reveal)-enter/.test(e.animationName)) clearTransition(e.target);
      });
      function animateTransition(fromIndex, toIndex) {
        document.querySelectorAll(".slide-enter, .reveal-enter").forEach(clearTransition);
        if (transition === "none" || reducedMotion.matches || fromIndex === null || fromIndex === toIndex) return;
        var contents = slideContents();
        var to = contents[toIndex];
        if (!to) return;
        var restart = function (el, cls) {
          void el.offsetWidth;
          el.classList.add(cls);
          // Fallback when animationend never fires (e.g. a skipped frame).
          setTimeout(function () {
            el.classList.remove(cls);
          }, 600);
        };
        if (groupOf(fromIndex) !== groupOf(toIndex)) {
          // A real slide change: animate the whole slide.
          var container = to.closest(".remark-slide-container");
          restart(container, "slide-enter");
          if (toIndex < fromIndex) container.classList.add("slide-enter-back");
          return;
        }
        // A `--` step forward: fade in only the blocks this step reveals (they
        // were reserved as .incremental-pending ghosts on the previous step).
        if (toIndex !== fromIndex + 1) return;
        var blocks = function (el) {
          return Array.prototype.filter.call(el.children, function (c) {
            return !c.classList.contains("remark-slide-number") && !c.classList.contains("slide-preview") &&
              !c.classList.contains("celebrate-overlay");
          });
        };
        var before = blocks(contents[fromIndex]);
        blocks(to).forEach(function (b, k) {
          if (before[k] && before[k].classList.contains("incremental-pending") && !b.classList.contains("incremental-pending")) {
            restart(b, "reveal-enter");
          }
        });
      }

      var lastIndex = null;
      slideshow.on("afterShowSlide", function (slide) {
        var index = slide.getSlideIndex();
        animateTransition(lastIndex, index);
        showNextPreview(index);
        shatterHeading(index);
        var contents = slideContents();
        var current = svgImages(contents[index]);
        if (lastIndex !== null && lastIndex !== index && groupOf(lastIndex) === groupOf(index)) {
          // Same slide, next/previous build step: move the playing images across.
          var playing = svgImages(contents[lastIndex]);
          current.forEach(function (img, k) {
            var src = playing[k] && originalSrc(playing[k]);
            if (src && src === originalSrc(img)) {
              var placeholder = playing[k].cloneNode();
              playing[k].replaceWith(placeholder);
              img.replaceWith(playing[k]);
            }
          });
          // Keep a running confetti burst on screen across build steps.
          contents[lastIndex].querySelectorAll(".celebrate-overlay").forEach(function (el) {
            contents[index].appendChild(el);
          });
          lastIndex = index;
          return;
        }
        lastIndex = index;
        current.forEach(function (img) {
            // A fresh element (not just a new src) gets its own animation timeline.
            var src = originalSrc(img);
            withFreshUrl(src, function (url) {
              if (!img.isConnected) return; // slide changed meanwhile
              var fresh = img.cloneNode();
              fresh.dataset.src = src;
              fresh.src = url;
              img.replaceWith(fresh);
            });
          });
        // `class: celebrate` slides get a fresh confetti burst on every show.
        document.querySelectorAll(".celebrate-overlay").forEach(function (el) {
          el.remove();
        });
        var slide = contents[index];
        if (slide.classList.contains("celebrate")) {
          var burst = document.createElement("img");
          burst.className = "celebrate-overlay";
          burst.alt = "";
          withFreshUrl("./img/confetti.svg", function (url) {
            burst.src = url;
            slide.appendChild(burst);
          });
        }
      });
    </script>
  </body>
</html>
